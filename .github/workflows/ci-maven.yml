name: Java CI with Maven in Linux

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      workdir: com.marcoaga02.car-rental-manager
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    strategy:
      matrix:
        include:
          - java: 11
            additional-maven-args: '-Pcoveralls'
          - java: 21
            additional-maven-args: >
              org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.organization=marcoaga02
              -Dsonar.projectKey=marcoaga02_car-rental-manager
              -Dsonar.host.url=https://sonarcloud.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
  
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2
            ~/.sonar/cache
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '**/*.yml') }}
          restore-keys: ${{ runner.os }}-m2-
  
      - name: Build with Maven
        run: xvfb-run mvn verify ${{ matrix.additional-maven-args }}
        working-directory: ${{ env.workdir }}

      - name: Generate JUnit Report
        run: mvn surefire-report:report-only
        working-directory: ${{ env.workdir }}
      
      - name: Archive JUnit Report
        uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: surefire-report-jdk-${{ matrix.java }}
          path: '**/target/surefire-reports'