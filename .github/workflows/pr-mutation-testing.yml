name: Java CI with Maven on Linux

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      workdir: com.marcoaga02.car-rental-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
      
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2
            ~/.sonar/cache
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '**/*.yml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Install VNC server and window manager
        run: sudo apt-get update && sudo apt-get install -y tigervnc-standalone-server fluxbox

      - name: Configure VNC xstartup
        run: |
          mkdir -p ~/.vnc
          printf '#!/bin/sh\nexec fluxbox \n' > ~/.vnc/xstartup
          chmod +x ~/.vnc/xstartup

      - name: Build with Maven under VNC
        run: bash "$GITHUB_WORKSPACE/.github/workflows/scripts/execute-on-vnc.sh" mvn verify -Pmutation-testing
        working-directory: ${{ env.workdir }}

      - name: Archive PIT Report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pit-report-jdk-17
          path: '**/target/pit-reports'
